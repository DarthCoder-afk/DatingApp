services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: heartlink
      POSTGRES_PASSWORD: heartlink   # OK for local-only dev DB
      POSTGRES_DB: heartlink
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U heartlink -d heartlink"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      target: development
    ports:
      - "5001:5000"
    env_file:
      - ./backend/.env    # secrets live here, already gitignored
    environment:
      PORT: 5000
      DATABASE_URL: postgresql://heartlink:heartlink@postgres:5432/heartlink
    depends_on:
      postgres:
        condition: service_healthy
    command: sh -c "pnpm prisma:push && pnpm dev"
    develop:
      watch:
        - action: sync
          path: ./backend/src
          target: /app/src
        - action: sync
          path: ./backend/prisma
          target: /app/prisma
        - action: rebuild
          path: ./backend/package.json
        - action: rebuild
          path: ./backend/pnpm-lock.yaml
        - action: rebuild
          path: ./backend/pnpm-workspace.yaml

  frontend:
    build:
      context: ./frontend
      target: development
      args:
        NEXT_PUBLIC_API_URL: http://localhost:5001/api
        NEXT_PUBLIC_SOCKET_URL: http://localhost:5001
    ports:
      - "3000:3000"
    depends_on:
      - backend
    develop:
      watch:
        - action: sync
          path: ./frontend/src
          target: /app/src
        - action: sync
          path: ./frontend/public
          target: /app/public
        - action: sync
          path: ./frontend/next.config.ts
          target: /app/next.config.ts
        - action: rebuild
          path: ./frontend/package.json
        - action: rebuild
          path: ./frontend/pnpm-lock.yaml
        - action: rebuild
          path: ./frontend/pnpm-workspace.yaml

volumes:
  postgres_data:
