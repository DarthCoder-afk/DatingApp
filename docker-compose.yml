services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: heartlink
      POSTGRES_PASSWORD: heartlink   # OK for local-only dev DB
      POSTGRES_DB: heartlink
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U heartlink -d heartlink"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    ports:
      - "5000:5000"
    env_file:
      - ./backend/.env    # secrets live here, already gitignored
    environment:
      PORT: 5000
      DATABASE_URL: postgresql://heartlink:heartlink@postgres:5432/heartlink
    depends_on:
      postgres:
        condition: service_healthy
    command: sh -c "pnpm prisma:push && pnpm start"

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:5000/api
        NEXT_PUBLIC_SOCKET_URL: http://localhost:5000
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
